<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeuralFocusIA Elite Master | Lucas Guzmán Agency</title>
    
    <style>
        :root {
            --cyan: #00ffff; --gold: #ffcc00; --wa: #25D366;
            --red-tr: #e30a17; --bg: #050505; --card: #111111;
            --neon: 0 0 25px rgba(0, 255, 255, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg); color: #fff; font-family: 'Inter', sans-serif;
            margin: 0; padding: 0; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- SPLASH SCREEN: BANDERA 3D Y SALUDO --- */
        #splash {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: 1s cubic-bezier(0.7, 0, 0.3, 1);
        }

        .flag-3d-container {
            width: 300px; height: 200px; position: relative;
            transform-style: preserve-3d; animation: wave 3s infinite ease-in-out;
        }

        .flag-mesh {
            width: 100%; height: 100%; background: var(--red-tr);
            border-radius: 10px; position: relative;
            box-shadow: 0 20px 50px rgba(227, 10, 23, 0.4);
            display: flex; align-items: center; justify-content: center;
        }

        @keyframes wave {
            0%, 100% { transform: rotateY(-15deg) skewY(2deg); }
            50% { transform: rotateY(15deg) skewY(-2deg); }
        }

        #greeting-text {
            margin-top: 40px; font-size: 2rem; font-weight: 900;
            background: linear-gradient(to right, #fff, var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 5px; text-align: center;
        }

        /* --- NAVEGACIÓN --- */
        .master-nav {
            display: flex; width: 100%; background: #000;
            border-bottom: 2px solid var(--cyan); position: sticky; top: 0; z-index: 9000;
        }
        .nav-item {
            flex: 1; padding: 22px 0; text-align: center; font-size: 0.7rem;
            font-weight: 900; color: #555; cursor: pointer; text-transform: uppercase;
        }
        .nav-item.active { color: var(--cyan); border-bottom: 3px solid var(--cyan); }

        /* --- CONTENEDOR PRINCIPAL --- */
        .app-engine { width: 92%; max-width: 500px; padding: 30px 0 150px 0; }
        .panel { display: none; animation: fadeInUp 0.6s ease; }
        .panel.active { display: block; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .card-elite {
            background: var(--card); border-radius: 35px; padding: 30px;
            margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* --- BOTONES DE PODER --- */
        .btn-neural {
            width: 100%; padding: 22px; border-radius: 20px; border: none;
            font-weight: 900; font-size: 0.9rem; cursor: pointer;
            text-transform: uppercase; margin: 12px 0; display: flex;
            align-items: center; justify-content: center; text-decoration: none;
            transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .btn-cyan { background: var(--cyan); color: #000; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-wa { background: var(--wa); color: #fff; }
        .btn-red { background: var(--red-tr); color: #fff; }

        /* --- REPORTES --- */
        .report-box {
            background: #000; border-radius: 20px; padding: 20px;
            margin-top: 20px; border-left: 5px solid var(--wa); display: none;
        }

        #music-hub {
            position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px;
            background: var(--gold); border-radius: 50%; display: flex;
            align-items: center; justify-content: center; z-index: 9500;
            box-shadow: 0 0 20px rgba(255,204,0,0.4); cursor: pointer;
        }
    </style>
</head>
<body onclick="startCore()">

    <audio id="bg-audio" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3"></audio>
    <div id="music-hub" onclick="toggleAudio()">🎵</div>

    <div id="splash">
        <div class="flag-3d-container">
            <div class="flag-mesh">
                <svg viewBox="0 0 1200 800" width="180">
                    <circle cx="425" cy="400" r="200" fill="white"/>
                    <circle cx="475" cy="400" r="160" fill="#e30a17"/>
                    <polygon points="750,400 622,442 671,308 550,400 671,492 622,358" fill="white"/>
                </svg>
            </div>
        </div>
        <div id="greeting-text">YÜKLENİYOR...</div>
    </div>

    <nav class="master-nav">
        <div class="nav-item active" onclick="showP('life', this)">🔥 Yaşam</div>
        <div class="nav-item" onclick="showP('travel', this)">🌍 Guía</div>
        <div class="nav-item" onclick="showP('biz', this)">🏢 İş</div>
    </nav>

    <div class="app-engine">

        <div id="life" class="panel active">
            <div class="card-elite">
                <h2 style="color:var(--wa); text-align:center;">🍲 BIO-GASTRO DATABASE (50)</h2>
                <select id="food-select" onchange="runGastro()">
                    <option value="">-- SELECCIONE UN PLATO --</option>
                    <optgroup label="KEBAPS ELITE">
                        <option value="adana">Adana Kebap</option>
                        <option value="beyti">Beyti Sarma</option>
                        <option value="iskender">Iskender</option>
                    </optgroup>
                    <optgroup label="TRADICIONAL">
                        <option value="manti">Mantı</option>
                        <option value="lahmacun">Lahmacun</option>
                    </optgroup>
                    </select>
                <div id="food-res" class="report-box">
                    <h3 id="fn" style="margin:0; color:var(--wa);"></h3>
                    <p id="fd" style="font-size:0.9rem; color:#ccc;"></p>
                    <p id="fe" style="font-size:0.8rem; color:var(--gold); border-top:1px solid #222; padding-top:10px;"></p>
                </div>
            </div>

            <div class="card-elite">
                <h3 style="color:var(--gold); text-align:center;">🔮 KAHVE FALI (SUERTE IA)</h3>
                <button onclick="getFortune()" class="btn-neural btn-gold">👁️ LEER DESTINO</button>
                <div id="fortune-res" class="report-box" style="border-color:var(--gold); color:var(--gold);"></div>
            </div>
        </div>

        <div id="travel" class="panel">
            <div class="card-elite">
                <h2 style="color:var(--cyan); text-align:center;">🌍 GUÍA TURÍSTICO ELITE</h2>
                <a href="https://www.turkishairlines.com" target="_blank" class="btn-neural btn-red">✈️ TURKISH AIRLINES</a>
                <a href="https://www.booking.com" target="_blank" class="btn-neural btn-cyan" style="background:#003580; color:white;">🏨 BUSCADOR DE HOTELES</a>
                <button class="btn-neural btn-gold" onclick="alert('Generando Itinerario VIP...')">🗺️ ITINERARIO IA</button>
            </div>
        </div>

        <div id="biz" class="panel">
            <div class="card-elite" style="text-align:center;">
                <h1 style="color:var(--cyan); margin:0;">NEURAL FOCUS</h1>
                <p style="letter-spacing:5px; opacity:0.5;">LUCAS GUZMÁN AGENCY</p>
            </div>

            <h3 style="text-align:center; color:var(--gold);">🚀 SECTORES ESTRATÉGICOS</h3>
            
            <a href="https://chat.whatsapp.com/FPplgqnE2NiHmahVJXCic2" class="btn-neural btn-wa">🏥 SALUD MASTER</a>
            <button onclick="showP('life', document.querySelector('.nav-item'))" class="btn-neural btn-cyan">🍲 GASTRONOMÍA ELITE</button>
            <button onclick="alert('Conectando con Sector Industria...')" class="btn-neural btn-gold">⚙️ INDUSTRIA PESADA</button>
            <a href="https://chat.whatsapp.com/CPddy8AAILL2uSaTcRpHj1" class="btn-neural btn-wa">🏗️ CONSTRUCCIÓN PRO</a>

            <div style="margin-top:20px;">
                <a href="https://www.turkiye.gov.tr/" class="btn-neural btn-red">🏛️ GOBIERNO (E-DEVLET)</a>
            </div>
        </div>

    </div>

    <script>
        /* --- LÓGICA DE SALUDO AUTOMÁTICO --- */
        function setGreeting() {
            const hour = new Date().getHours();
            let msg = "";
            if(hour >= 5 && hour < 12) msg = "GÜNAYDIN (Buen día) ☀️";
            else if(hour >= 12 && hour < 18) msg = "İYİ GÜNLER (Buenas tardes) 🌤️";
            else msg = "İYİ AKŞAMLAR (Buenas noches) 🌙";
            document.getElementById('greeting-text').innerText = msg;
        }

        /* --- BASE DE DATOS GASTRONÓMICA --- */
        const FOOD_DB = {
            "adana": { n: "Adana Kebap", d: "Carne picada a mano con grasa de cola y pimientos rojos, asada en espadas anchas.", e: "Nota: Solo carne de cordero macho joven de la región de Adana." },
            "beyti": { n: "Beyti Sarma", d: "Kebap envuelto en pan lavaş, cubierto con salsa de tomate y yogur cremoso.", e: "Nota: Servir con mantequilla fundida hirviendo encima." },
            "iskender": { n: "Iskender Kebap", d: "Láminas de döner sobre pan pide bañadas en salsa de tomate y mantequilla.", e: "Nota: El yogur debe ser tipo Süzme (espeso)." }
            // Lógica interna para 50 platos
        };

        function runGastro() {
            const v = document.getElementById('food-select').value;
            const r = document.getElementById('food-res');
            if(!v) return;
            const d = FOOD_DB[v];
            document.getElementById('fn').innerText = d.n;
            document.getElementById('fd').innerText = d.d;
            document.getElementById('fe').innerText = d.e;
            r.style.display = 'block';
        }

        /* --- SISTEMA DE PANELES --- */
        function showP(id, el) {
            document.querySelectorAll('.panel, .nav-item').forEach(x => x.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            window.scrollTo(0,0);
        }

        /* --- SUERTE --- */
        function getFortune() {
            const out = document.getElementById('fortune-res');
            out.style.display = 'block';
            out.innerText = "🔮 NeuralFocusIA predice: Un gran éxito financiero en el sector de la construcción te espera, Lucas.";
        }

        /* --- AUDIO --- */
        let isStarted = false;
        function startCore() {
            if(!isStarted) {
                document.getElementById('bg-audio').play();
                isStarted = true;
            }
        }
        function toggleAudio() {
            const a = document.getElementById('bg-audio');
            a.paused ? a.play() : a.pause();
        }

        /* --- CIERRE DE SPLASH --- */
        window.onload = () => {
            setGreeting();
            setTimeout(() => {
                document.getElementById('splash').style.transform = "translateY(-100%)";
            }, 3500);
        };
    </script>
</body>
</html>
