<!DOCTYPE html>
<html lang="tr">
<head>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-T47G2SRX');</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LALE - İstanbul Digital Hub</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <meta name="theme-color" content="#003049">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=L&background=D4AF37&color=000&size=192">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --turkish-red: #E30A17;
            --bosphorus-blue: #003049;
            --bizantine-gold: #D4AF37;
            --white-glass: rgba(255, 255, 255, 0.95);
            --dark-glass: rgba(15, 23, 42, 0.98);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: #000; color: white; height: 100vh; overflow: hidden; }

        .video-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; object-fit: cover; filter: brightness(0.35) contrast(1.1);
        }

        /* NATIVE JAM PANEL */
        #jam-panel {
            position: fixed; bottom: -100%; left: 0; right: 0; height: 80vh;
            background: var(--dark-glass); border-top: 3px solid var(--bizantine-gold);
            border-radius: 40px 40px 0 0; z-index: 9995; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 25px; display: flex; flex-direction: column; backdrop-filter: blur(20px);
        }
        #jam-panel.active { bottom: 0; }
        .jam-chat { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; margin: 20px 0; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { background: rgba(212, 175, 55, 0.15); padding: 12px 16px; border-radius: 18px; font-size: 13px; border-left: 3px solid var(--bizantine-gold); width: fit-content; max-width: 85%; }

        .app-shell { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; }

        #splash {
            position: fixed; inset: 0; background: var(--bosphorus-blue);
            z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: 1s ease-in-out;
        }

        #push-notif {
            position: fixed; top: -120px; left: 20px; right: 20px; background: var(--white-glass);
            color: #1e293b; padding: 20px; border-radius: 28px; z-index: 9999;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4); transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex; align-items: center; gap: 15px; backdrop-filter: blur(15px);
        }

        header { padding: 55px 25px 15px; display: flex; justify-content: space-between; align-items: center; }
        .app-title { font-size: 34px; font-weight: 800; letter-spacing: -1.5px; }

        .muhtar-panel {
            background: rgba(227, 10, 23, 0.15); border: 1px solid rgba(227, 10, 23, 0.4);
            border-radius: 20px; padding: 12px 18px; margin: 10px 0 20px;
            display: flex; align-items: center; gap: 12px; backdrop-filter: blur(10px);
        }

        main { flex: 1; overflow-y: auto; padding: 0 22px 140px; }
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; } }

        .card-ui { background: var(--white-glass); border-radius: 26px; padding: 18px; color: #0f172a; display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
        .btn-jam { background: linear-gradient(135deg, var(--bizantine-gold), #b8860b); color: #000; font-weight: 800; padding: 22px; border-radius: 26px; width: 100%; border: none; font-size: 16px; margin: 10px 0; box-shadow: 0 12px 24px rgba(212, 175, 55, 0.4); }

        nav { position: fixed; bottom: 30px; left: 22px; right: 22px; height: 85px; background: var(--dark-glass); border-radius: 32px; display: flex; justify-content: space-around; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
        .nav-link { color: #94a3b8; text-align: center; flex: 1; }
        .nav-link.active { color: var(--bizantine-gold); }
        .label { font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.6); text-transform: uppercase; margin: 25px 0 12px; letter-spacing: 1.5px; display: block; }
    </style>
</head>
<body id="mainBody">

<video class="video-bg" autoplay muted loop playsinline>
    <source src="https://assets.mixkit.co/videos/preview/mixkit-mosque-of-istanbul-at-sunset-20235-large.mp4" type="video/mp4">
</video>

<div id="jam-panel">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2 style="color: var(--bizantine-gold); font-size: 24px;">LALE JAM</h2>
            <p id="jam-status" style="font-size: 11px; opacity: 0.6;">Canlı Sohbet Odası</p>
        </div>
        <button onclick="toggleJamPanel()" style="background: rgba(255,255,255,0.1); border: none; color: white; padding: 10px 18px; border-radius: 15px; font-weight: 800;">KAPAT</button>
    </div>
    
    <div class="jam-chat" id="chat-box">
        </div>
    
    <div style="display: flex; gap: 10px;">
        <input type="text" id="chat-input" placeholder="Mesaj yazın..." style="flex:1; padding: 18px; border-radius: 20px; border: none; background: rgba(255,255,255,0.1); color: white;">
        <button onclick="sendMessage()" style="background: var(--bizantine-gold); border: none; width: 60px; border-radius: 20px; color: black;"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<div id="splash">
    <div class="tulip-logo" style="font-size: 85px;">🌷</div>
    <h1 style="color: white; letter-spacing: 12px; margin-top: 25px; font-weight: 800;">LALE</h1>
</div>

<div id="push-notif">
    <div id="ni" style="width: 48px; height: 48px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 22px;"></div>
    <div style="flex:1;">
        <b id="nt" style="font-size: 15px; display: block;"></b>
        <p id="nm" style="font-size: 12px;"></p>
    </div>
</div>

<div class="app-shell">
    <header>
        <div class="app-title">LALE</div>
        <div style="background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 50px; font-size: 11px; font-weight: 800;">TR | EN</div>
    </header>

    <main>
        <section id="home" class="screen active">
            <div class="muhtar-panel">
                <div style="width: 8px; height: 8px; background: #00ff00; border-radius: 50%;"></div>
                <div style="flex:1;">
                    <b style="font-size: 11px; color: var(--turkish-red); display: block;">MAHALLE MUHTARI</b>
                    <p id="muhtar-text" style="font-size: 13px; font-weight: 600;">Yükleniyor...</p>
                </div>
            </div>

            <h2 id="dynamic-greeting" style="font-size: 36px; font-weight: 800;">Merhaba</h2>
            <p style="color: rgba(255,255,255,0.8); margin-bottom: 25px;">İstanbul'un dijital kalbi.</p>

            <button class="btn-jam" onclick="toggleJamPanel()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> LALE JAM BAŞLAT
            </button>

            <span class="label">Ulaşım</span>
            <div class="card-ui" onclick="window.open('uber://', '_blank')">
                <div style="width: 46px; height: 46px; background: #000; color: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center;"><i class="fa-brands fa-uber"></i></div>
                <div style="flex:1;"><b>Uber İstanbul</b></div>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
            
            <div class="card-ui" onclick="window.open('https://bitaksi.com', '_blank')">
                <div style="width: 46px; height: 46px; background: #FFD600; color: #000; border-radius: 14px; display: flex; align-items: center; justify-content: center;"><i class="fa-solid fa-taxi"></i></div>
                <div style="flex:1;"><b>BiTaksi</b></div>
            </div>
        </section>

        <section id="wallet" class="screen">
            <h2 style="font-size: 30px; font-weight: 800;">Lale Pay</h2>
            <div class="card-ui" style="margin-top: 20px;">
                <div style="width: 50px; height: 50px; background: #FF6200; color: #fff; border-radius: 16px; display: flex; align-items: center; justify-content: center;"><i class="fa-solid fa-id-card"></i></div>
                <div style="flex:1;"><b>İstanbulkart</b><p style="font-size: 11px;">Bakiye: 45.50 TL</p></div>
            </div>
        </section>

        <section id="profile" class="screen">
            <div style="text-align: center; padding: 40px 0;">
                <img src="https://ui-avatars.com/api/?name=Lucas+Guzman&background=003049&color=fff" style="width: 120px; border-radius: 50%; border: 4px solid var(--bizantine-gold);">
                <h3 style="margin-top: 15px; font-size: 26px;">Lucas Guzmán</h3>
                <p style="color: var(--bizantine-gold); font-size: 12px; font-weight: 800;">KURUCU ÜYE</p>
            </div>
        </section>
    </main>

    <nav>
        <div class="nav-link active" onclick="changeTab('home', this)"><i class="fa-solid fa-house"></i></div>
        <div class="nav-link" onclick="window.open('https://www.sehirhatlari.istanbul/', '_blank')"><i class="fa-solid fa-ship"></i></div>
        <div class="nav-link" onclick="changeTab('wallet', this)"><i class="fa-solid fa-wallet"></i></div>
        <div class="nav-link" onclick="changeTab('profile', this)"><i class="fa-solid fa-circle-user"></i></div>
    </nav>
</div>

<script>
    // CONFIGURACIÓN FIREBASE (PROYECTO MENTEVIVA)
    const firebaseConfig = {
        apiKey: "AIzaSyBAxLK8shFQEcKdMiIjq9BTib1cPUaVOno",
        authDomain: "gen-lang-client-0899638282.firebaseapp.com",
        projectId: "gen-lang-client-0899638282",
        storageBucket: "gen-lang-client-0899638282.firebasestorage.app",
        messagingSenderId: "837834829290",
        appId: "1:837834829290:web:6d2b153ecf341824501693"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 1. CHAT EN TIEMPO REAL (LALE JAM)
    function toggleJamPanel() {
        document.getElementById('jam-panel').classList.toggle('active');
        if(document.getElementById('jam-panel').classList.contains('active')) {
            showPush("LALE JAM", "Canlı odaya bağlandınız.", "fa-wand-magic-sparkles", "#D4AF37");
        }
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        if(input.value.trim() !== "") {
            db.collection("lalejam").add({
                user: "Lucas", // Esto puede ser dinámico luego
                text: input.value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            input.value = "";
        }
    }

    // Escuchar mensajes de Firebase
    db.collection("lalejam").orderBy("timestamp", "asc").onSnapshot((snapshot) => {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = "";
        snapshot.forEach((doc) => {
            const m = doc.data();
            chatBox.innerHTML += `<div class="chat-msg"><b>${m.user}:</b> ${m.text}</div>`;
        });
        chatBox.scrollTop = chatBox.scrollHeight;
        document.getElementById('jam-status').innerText = `${snapshot.size} Mesaj - Canlı`;
    });

    // 2. MUHTAR FEED DESDE FIREBASE
    db.collection("settings").doc("muhtar").onSnapshot((doc) => {
        if (doc.exists) {
            document.getElementById('muhtar-text').innerText = doc.data().message;
        } else {
            document.getElementById('muhtar-text').innerText = "Beşiktaş'ta sular 22:00'de kesilecektir.";
        }
    });

    // 3. LÓGICA DE UI (SPLASH, TABS, GREETING)
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => document.getElementById('splash').style.display = 'none', 1000);
        }, 2500);
        
        const h = new Date().getHours();
        document.getElementById('dynamic-greeting').innerText = h < 12 ? "Günaydın" : h < 18 ? "İyi Günler" : "İyi Akşamlar";
    };

    function changeTab(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function showPush(title, msg, icon, color) {
        const p = document.getElementById('push-notif');
        document.getElementById('nt').innerText = title;
        document.getElementById('nm').innerText = msg;
        const i = document.getElementById('ni');
        i.innerHTML = `<i class="fa-solid ${icon}"></i>`;
        i.style.color = color; i.style.background = color + "20";
        p.style.top = '25px';
        setTimeout(() => p.style.top = '-120px', 4000);
    }
</script>
</body>
</html>
