<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeuralFocus AI Global</title>
    <style>
        :root {
            --cyan: #00ffff; --gold: #ffcc00; --wa: #25D366;
            --red-tr: #e30a17; --bg: #050505; --card: #121212;
            --text: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; overflow-x: hidden; }

        /* --- SPLASH SCREEN: LOGO NEURALFOCUS --- */
        #splash {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: 1s ease-in-out;
        }
        .neural-logo {
            width: 80px; height: 80px; border: 3px solid var(--cyan);
            border-radius: 15px; position: relative; animation: rotateLogo 4s infinite linear;
            box-shadow: 0 0 40px var(--cyan);
        }
        @keyframes rotateLogo { 
            0% { transform: rotate(0deg) scale(1); } 
            50% { transform: rotate(180deg) scale(1.1); } 
            100% { transform: rotate(360deg) scale(1); } 
        }
        #greeting { margin-top: 30px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; color: var(--cyan); }

        /* --- LAYOUT PRINCIPAL --- */
        .app-container { display: none; padding: 20px; max-width: 600px; margin: auto; }
        .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #222; margin-bottom: 20px; }
        .header h1 { font-size: 1.5rem; letter-spacing: 2px; color: var(--cyan); margin: 0; }

        .card { background: var(--card); border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid #222; }
        
        /* --- BOTONES FUNCIONALES --- */
        .btn { 
            width: 100%; padding: 18px; border-radius: 12px; border: none; 
            font-weight: 900; cursor: pointer; margin-bottom: 12px; 
            text-transform: uppercase; transition: 0.3s;
        }
        .btn-cyan { background: var(--cyan); color: #000; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-wa { background: var(--wa); color: #fff; }

        /* --- SISTEMAS INTERACTIVOS --- */
        #cam-box { display: none; width: 100%; border-radius: 15px; overflow: hidden; margin-bottom: 15px; border: 2px solid var(--gold); background: #000; }
        video { width: 100%; height: auto; }

        .result-panel { 
            display: none; background: #000; padding: 15px; border-radius: 10px; 
            border-left: 4px solid var(--cyan); margin-top: 15px; font-size: 0.9rem; line-height: 1.6;
        }

        select, input {
            width: 100%; padding: 15px; border-radius: 10px; background: #000; 
            color: #fff; border: 1px solid #333; margin-bottom: 15px;
        }

        /* BOTÓN FLOTANTE */
        .wa-float {
            position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px;
            background: var(--wa); border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 5px 20px #000;
        }
    </style>
</head>
<body>

    <div id="splash">
        <div class="neural-logo"></div>
        <div id="greeting">Iniciando NeuralFocus AI...</div>
    </div>

    <div class="app-container" id="app">
        <div class="header">
            <h1>NEURALFOCUS AI GLOBAL</h1>
        </div>

        <div class="card">
            <h3 style="color:var(--gold); margin-top:0;">🔮 LECTOR DE CAFÉ (VISION IA)</h3>
            <div id="cam-box"><video id="video" autoplay playsinline></video></div>
            <button class="btn btn-gold" id="cam-btn" onclick="toggleCamera()">ACTIVAR ESCÁNER BIOMÉTRICO</button>
            <div id="coffee-res" class="result-panel" style="border-color: var(--gold);"></div>
        </div>

        <div class="card">
            <h3 style="color:var(--wa); margin-top:0;">🍲 BIO-GASTRO DATABASE</h3>
            <select id="food-select" onchange="searchFood()">
                <option value="">Buscar Plato Turco...</option>
                <option value="adana">Adana Kebap (Carne/Proteína)</option>
                <option value="baklava">Baklava (Energía/Dulce)</option>
                <option value="iskender">Iskender (Especialidad Bursa)</option>
                <option value="manti">Manti (Carbohidratos Anatolia)</option>
                <option value="lahmacun">Lahmacun (Pizza Turca)</option>
                </select>
            <div id="food-res" class="result-panel" style="border-color: var(--wa);"></div>
        </div>

        <div class="card">
            <h3 style="color:var(--cyan); margin-top:0;">🌍 MODERN TRIP SUPPORT</h3>
            <input type="text" id="city-input" placeholder="Ingresa ciudad (Ej: Estambul)">
            <button class="btn btn-cyan" onclick="getTripInfo()">ANALIZAR DESTINO Y VUELOS</button>
            <div id="trip-res" class="result-panel"></div>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">🏢 SECTORES ESTRATÉGICOS</h3>
            <button class="btn btn-cyan" onclick="openSector('SALUD')">CONEXIÓN SECTOR SALUD</button>
            <button class="btn btn-gold" onclick="openSector('CONSTRUCCION')">SECTOR CONSTRUCCIÓN</button>
            <button class="btn btn-wa" onclick="openSector('ASISTENTE')">VIRTUAL RESEARCH ASSISTANT</button>
            <div id="sector-res" class="result-panel" style="border-color: #fff;"></div>
        </div>
    </div>

    <div class="wa-float" onclick="window.open('https://wa.me/542246496971')">💬</div>

    <script>
        // BASE DE DATOS REAL
        const DATA = {
            foods: {
                "adana": "<b>ADANA KEBAP:</b> Carne de cordero picada con pimiento rojo. Análisis: 650kcal. Rico en hierro y proteínas.",
                "baklava": "<b>BAKLAVA:</b> 40 capas de masa filo y pistacho. Análisis: 450kcal por porción. Alta energía inmediata.",
                "iskender": "<b>ISKENDER:</b> Döner sobre pan con mantequilla fundida. Plato icónico de la región de Bursa.",
                "manti": "<b>MANTI:</b> Dumplings de carne con yogur frío y aceite picante. Balance perfecto de carbohidratos.",
                "lahmacun": "<b>LAHMACUN:</b> Base fina de masa con carne picada y especias. Bajo en grasas si se añade limón."
            },
            trips: {
                "estambul": "<b>REPORTE ESTAMBUL:</b> Vuelos disponibles via Turkish Airlines. Seguridad: Óptima. Clima: Templado. Destino recomendado: Sultanahmet.",
                "antalya": "<b>REPORTE ANTALYA:</b> Destino de playa y resorts. Alta demanda en verano. Aeropuerto internacional activo."
            }
        };

        // SALUDO AUTOMÁTICO Y SPLASH
        window.onload = () => {
            const h = new Date().getHours();
            const g = document.getElementById('greeting');
            if(h < 12) g.innerText = "GÜNAYDIN (BUEN DÍA) ☀️";
            else if(h < 18) g.innerText = "İYİ GÜNLER (BUENAS TARDES) 🌤️";
            else g.innerText = "İYİ AKŞAMLAR (BUENAS NOCHES) 🌙";

            setTimeout(() => {
                document.getElementById('splash').style.opacity = "0";
                setTimeout(() => {
                    document.getElementById('splash').style.display = "none";
                    document.getElementById('app').style.display = "block";
                }, 800);
            }, 3000);
        };

        // FUNCIONALIDAD: CÁMARA REAL
        let streamActive = null;
        async function toggleCamera() {
            const box = document.getElementById('cam-box');
            const btn = document.getElementById('cam-btn');
            const res = document.getElementById('coffee-res');

            if (!streamActive) {
                try {
                    streamActive = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    document.getElementById('video').srcObject = streamActive;
                    box.style.display = "block";
                    btn.innerText = "ANALIZAR TAZA DE CAFÉ";
                } catch (e) { alert("Error al acceder a la cámara."); }
            } else {
                res.style.display = "block";
                res.innerHTML = "<b>ANÁLISIS NEURAL:</b> Veo éxito financiero y un viaje inminente a Turquía. El camino está despejado.";
                streamActive.getTracks().forEach(track => track.stop());
                streamActive = null;
                box.style.display = "none";
                btn.innerText = "ACTIVAR ESCÁNER BIOMÉTRICO";
            }
        }

        // FUNCIONALIDAD: BUSCADOR DE COMIDA
        function searchFood() {
            const val = document.getElementById('food-select').value;
            const res = document.getElementById('food-res');
            if(!val) return;
            res.style.display = "block";
            res.innerHTML = DATA.foods[val] || "Análisis nutricional en proceso para este plato.";
        }

        // FUNCIONALIDAD: GUÍA DE VIAJE
        function getTripInfo() {
            const city = document.getElementById('city-input').value.toLowerCase();
            const res = document.getElementById('trip-res');
            res.style.display = "block";
            res.innerHTML = DATA.trips[city] || `<b>REPORTE PARA ${city.toUpperCase()}:</b> Analizando seguridad y vuelos... Destino disponible para planificación VIP.`;
        }

        // FUNCIONALIDAD: SECTORES
        function openSector(name) {
            const res = document.getElementById('sector-res');
            res.style.display = "block";
            res.innerHTML = `🌀 <b>CONECTANDO CON SECTOR ${name}...</b><br>Acceso concedido. Cargando base de datos estratégica de Turquía.`;
        }
    </script>
</body>
</html>
