<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Focus AI | Lucas Guzmán</title>
    
    <style>
        :root {
            --cyan: #00ffff;
            --purple: #bc13fe;
            --gold: #ffcc00;
            --wa-green: #25D366;
            --turk-red: #e30a17;
            --dark: #000000;
        }

        body {
            background-color: var(--dark);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
            transition: opacity 0.8s ease;
        }
        .logo-pulse {
            width: 150px; height: 150px; border: 2px solid var(--cyan);
            border-radius: 50%; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            animation: pulse 1.5s infinite ease-in-out;
            box-shadow: 0 0 20px var(--cyan);
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* --- NAVEGACIÓN --- */
        .tab-bar {
            display: flex; width: 100%; background: #000;
            border-bottom: 2px solid var(--cyan); position: sticky; top: 0; z-index: 1000;
        }
        .tab {
            flex: 1; padding: 18px 0; text-align: center; font-size: 0.75rem;
            font-weight: 900; color: #555; cursor: pointer; text-transform: uppercase;
        }
        .tab.active { color: var(--cyan); border-bottom: 3px solid var(--cyan); }

        .container { 
            width: 90%; max-width: 400px; 
            padding: 20px 0 100px 0;
            display: flex; flex-direction: column; align-items: center;
        }
        
        .panel { display: none; width: 100%; flex-direction: column; align-items: center; }
        .panel.active { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card {
            width: 100%; background: rgba(255,255,255,0.05); border-radius: 20px; 
            padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box; text-align: center; position: relative;
        }

        /* --- INPUTS Y BOTONES --- */
        input {
            width: 100%; max-width: 320px; padding: 15px; border-radius: 12px; 
            border: 1px solid var(--purple); background: #111; color: #fff; 
            margin-bottom: 15px; text-align: center; font-size: 1rem;
            box-sizing: border-box; outline: none;
        }

        .btn {
            width: 100%; max-width: 320px; padding: 16px; border-radius: 12px; 
            border: none; color: white; font-weight: 800; font-size: 0.85rem; 
            margin: 8px 0; cursor: pointer; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; box-sizing: border-box;
        }

        .btn-cyan { background: var(--cyan); color: #000; }
        .btn-purple { background: var(--purple); }
        .btn-red { background: var(--turk-red); }
        .btn-gold { background: linear-gradient(90deg, #ffcc00, #ff9900); color: #000; }

        /* --- LOADING OVERLAY PARA IA --- */
        .loading-ia {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); border-radius: 20px;
            flex-direction: column; justify-content: center; align-items: center; z-index: 10;
        }

        footer {
            text-align: center; font-size: 0.65rem; color: #555;
            padding: 40px 10px; width: 100%; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="splash">
        <div class="logo-pulse">
            <span id="txtGreet" style="font-size: 0.6rem; color: #888; margin-bottom: 5px;">YÜKLENİYOR</span>
            <span style="font-weight: 900; font-size: 1.2rem;">NEURAL</span>
            <span style="color: var(--cyan); letter-spacing: 4px;">FOCUS AI</span>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab active" onclick="nav('biz', this)">🏢 BUSINESS</div>
        <div class="tab" onclick="nav('life', this)">🔥 LIFESTYLE</div>
    </div>

    <div class="container">
        
        <div id="biz" class="panel active">
            <h1 style="color: var(--cyan); letter-spacing: 2px;">NEURAL FOCUS AI</h1>
            <input type="text" id="uName" placeholder="Adınızı giriniz">
            <a href="https://wa.me/5492246496971" target="_blank" class="btn btn-red">☕ BİR ÇAY ISMARLA (WhatsApp Personal)</a>
        </div>

        <div id="life" class="panel">
            <h2 style="color:var(--purple); margin-bottom:20px;">LIFESTYLE AI</h2>
            
            <div class="card" id="cardCoffee">
                <div class="loading-ia" id="loadCoffee">
                    <div style="border: 3px solid var(--purple); border-top: 3px solid #fff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;"></div>
                    <p style="font-size: 0.7rem; margin-top: 10px;">IA Fincanı Analiz Ediyor...</p>
                </div>
                <h4 style="color:var(--purple); margin-bottom:10px;">🔮 KAHVE FALI (IA)</h4>
                <input type="file" id="coffeeCam" accept="image/*" capture="environment" style="display:none;" onchange="processIA('coffee')">
                <button onclick="document.getElementById('coffeeCam').click()" class="btn btn-purple" style="margin: 0 auto;">FOTOĞRAF ÇEK VE OKU</button>
                <div id="resCoffee" style="font-size:0.8rem; margin-top:10px; color:var(--gold); font-weight: bold;"></div>
            </div>

            <div class="card" id="cardGastro">
                <div class="loading-ia" id="loadGastro">
                    <div style="border: 3px solid var(--cyan); border-top: 3px solid #fff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;"></div>
                    <p style="font-size: 0.7rem; margin-top: 10px;">Gastro-Sağlık Analizi Yapılıyor...</p>
                </div>
                <h4 style="color:var(--cyan); margin-bottom:10px;">🍲 GASTRO-SAĞLIK VİZYONU</h4>
                <input type="file" id="gastroCam" accept="image/*" capture="environment" style="display:none;" onchange="processIA('gastro')">
                <button onclick="document.getElementById('gastroCam').click()" class="btn btn-cyan" style="margin: 0 auto;">YEMEĞİ TARA</button>
                <div id="resGastro" style="font-size:0.75rem; margin-top:10px; color:var(--wa-green);"></div>
            </div>
        </div>

    </div>

    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <script>
        function speak(t) {
            const m = new SpeechSynthesisUtterance(t);
            m.lang = 'tr-TR';
            window.speechSynthesis.speak(m);
        }

        window.onload = () => {
            const h = new Date().getHours();
            let g = h < 12 ? "GÜNAYDIN" : h < 18 ? "İYİ GÜNLER" : "İYİ AKŞAMLAR";
            document.getElementById('txtGreet').innerText = g;
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').style.display = 'none', 800);
            }, 2500);
        };

        function nav(id, el) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        function processIA(type) {
            const load = type === 'coffee' ? document.getElementById('loadCoffee') : document.getElementById('loadGastro');
            const res = type === 'coffee' ? document.getElementById('resCoffee') : document.getElementById('resGastro');
            
            load.style.display = 'flex';
            res.innerText = "";

            setTimeout(() => {
                load.style.display = 'none';
                let msg = "";
                if(type === 'coffee') {
                    const predictions = ["Kısmetin açılıyor, büyük projeler yolda.", "Fincanın çok parlak, yakında bir müjde alacaksın.", "Yolun açık, Lucas Guzmán Agency ile başarı seni bekliyor."];
                    msg = predictions[Math.floor(Math.random() * predictions.length)];
                    res.innerText = "🔮 IA Yorumu: " + msg;
                } else {
                    msg = "Bu Türk yemeği harika bir enerji kaynağı! Dengeli ve sağlıklı bir öğün. Afiyet olsun.";
                    res.innerText = "🥗 Sağlık Analizi: " + msg;
                }
                speak(msg);
            }, 3500); // Tiempo de carga simulado para impacto UX
        }
    </script>
</body>
                    </html>
