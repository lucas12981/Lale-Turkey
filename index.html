<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lale Turkey - Elite Experience</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --tr-red: #E30A17;
            --gold: #FFD700;
            --glass-bg: rgba(0, 0, 0, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        /* Reset y Prevención de Errores Visuales */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { 
            height: 100vh; width: 100vw; 
            background-color: #000; 
            color: #fff; 
            overflow: hidden; 
            position: fixed; 
        }

        /* --- FONDO CINEMÁTICO --- */
        .bg-container {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(to bottom, #1a1a1a, #000);
        }
        .bg-container video {
            width: 100%; height: 100%; object-fit: cover;
            filter: brightness(0.4) saturate(1.2);
            opacity: 0; transition: opacity 1.5s ease;
        }
        .bg-container.loaded video { opacity: 1; }
        .overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent, #000); }

        /* --- SPLASH SCREEN: TULIPÁN 3D --- */
        #splash {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 0.8s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.5s;
        }
        .tulip-3d { 
            width: 80px; height: 120px; position: relative; 
            transform-style: preserve-3d; animation: spin 4s infinite linear; 
        }
        .petal { 
            position: absolute; width: 45px; height: 85px; 
            background: linear-gradient(135deg, #ff4d4d, var(--tr-red)); 
            border-radius: 50% 50% 15% 15%; transform-origin: bottom center; 
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 0 25px rgba(227, 10, 23, 0.4);
        }
        .p1 { transform: rotateY(0deg) rotateX(15deg); }
        .p2 { transform: rotateY(120deg) rotateX(15deg); }
        .p3 { transform: rotateY(240deg) rotateX(15deg); }
        @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        
        .splash-text { margin-top: 35px; text-align: center; }
        .splash-text h1 { letter-spacing: 6px; font-weight: 800; font-size: 24px; margin-bottom: 5px; }
        .splash-text p { color: var(--tr-red); font-size: 11px; font-weight: 600; letter-spacing: 1px; }

        /* --- UI PRINCIPAL --- */
        .app-shell {
            width: 100%; max-width: 450px; height: 100%; margin: 0 auto;
            display: flex; flex-direction: column; opacity: 0;
            transition: opacity 1s ease;
        }
        .app-shell.active { opacity: 1; }

        header { padding: 50px 25px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-lale { font-size: 26px; font-weight: 900; letter-spacing: 2px; }

        .content { flex: 1; overflow-y: auto; padding: 0 20px 120px; scrollbar-width: none; }
        .content::-webkit-scrollbar { display: none; }

        /* --- TICKER --- */
        .news-box {
            background: rgba(227, 10, 23, 0.2); border: 1px solid var(--tr-red);
            border-radius: 20px; padding: 12px 18px; margin-bottom: 25px;
            backdrop-filter: blur(10px); display: flex; align-items: center; gap: 12px;
        }
        .live-tag { width: 8px; height: 8px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 10px #00ff00; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.3; } }

        /* --- CARDS --- */
        .glass-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 30px; padding: 22px; margin-bottom: 20px;
            backdrop-filter: blur(20px);
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-header h3 { font-size: 18px; color: var(--gold); display: flex; align-items: center; gap: 10px; }

        .bazar-flex { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 5px; }
        .bazar-card { 
            min-width: 150px; background: rgba(255,255,255,0.05); border-radius: 22px; padding: 18px; 
            border: 1px solid rgba(255,255,255,0.08); text-align: center;
        }
        .btn-gold { background: var(--tr-red); color: #fff; border: none; width: 100%; padding: 10px; border-radius: 12px; font-weight: 800; font-size: 11px; margin-top: 12px; cursor: pointer; }

        /* --- NUEVO: LALE VIP DRIVE (Estilo Uber) --- */
        .ride-card {
            background: linear-gradient(135deg, rgba(227, 10, 23, 0.1), rgba(0, 0, 0, 0.6));
            border: 1px solid var(--tr-red); border-radius: 30px; padding: 22px; margin-bottom: 20px;
            backdrop-filter: blur(20px);
        }
        .ride-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .ride-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.3s;
        }
        .ride-btn:active { transform: scale(0.95); background: var(--tr-red); }
        .ride-btn i { font-size: 24px; color: var(--gold); margin-bottom: 8px; display: block; }
        .ride-btn p { font-size: 10px; font-weight: 800; letter-spacing: 1px; }

        /* --- NAV --- */
        nav {
            position: absolute; bottom: 25px; left: 20px; right: 20px;
            height: 75px; background: var(--glass-bg); border-radius: 25px;
            border: 1px solid var(--glass-border); display: flex; justify-content: space-around;
            align-items: center; backdrop-filter: blur(25px);
        }
        .nav-item { color: rgba(255,255,255,0.4); display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: none; cursor: pointer; }
        .nav-item.active { color: var(--tr-red); }
        .nav-item i { font-size: 22px; }
        .nav-item span { font-size: 10px; font-weight: 700; }

        /* --- MODALES --- */
        #cameraModal, #fortuneOverlay, #exitOverlay { position: fixed; inset: 0; z-index: 10000; display: none; }
        #cameraModal { background: #000; flex-direction: column; }
        #videoFeed { width: 100%; height: 100%; object-fit: cover; }
        .camera-ui { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 30px; }
        .capture-btn { width: 70px; height: 70px; border-radius: 50%; border: 5px solid #fff; background: transparent; cursor: pointer; }
        
        #fortuneOverlay { background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; }
        .fortune-card { background: var(--glass-bg); border: 2px solid var(--gold); padding: 30px; border-radius: 30px; backdrop-filter: blur(20px); animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .scanning-line { width: 100%; height: 2px; background: var(--gold); position: absolute; top: 0; left: 0; box-shadow: 0 0 15px var(--gold); animation: scan 2s linear infinite; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        /* SALIDA ELEGANTE */
        #exitOverlay { background: #000; z-index: 20000; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity 2s ease; }
        .exit-text { font-size: 22px; font-weight: 800; color: var(--tr-red); letter-spacing: 4px; text-align: center; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="tulip-3d"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div></div>
        <div class="splash-text"><h1>LALE TURKEY</h1><p>ESTANBUL'UN DİJİTAL KALBİ</p></div>
    </div>

    <div class="bg-container" id="bgContainer">
        <video id="mainVideo" autoplay muted loop playsinline oncanplay="this.parentElement.classList.add('loaded')">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-istanbul-at-sunset-40230-large.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>

    <div class="app-shell" id="appShell">
        <header>
            <div class="logo-lale">LALE</div>
            <i class="fa-solid fa-circle-user" style="font-size: 24px;"></i>
        </header>

        <main class="content">
            <div class="news-box">
                <div class="live-tag"></div>
                <p id="tickerText" style="font-size: 12px; font-weight: 600;">Yükleniyor...</p>
            </div>

            <section class="glass-card" style="border: 1px solid var(--gold);">
                <div class="card-header">
                    <h3><i class="fa-solid fa-mug-hot"></i> Yapay Zeka Kahve Falı</h3>
                </div>
                <button class="btn-gold" onclick="openCamera()" style="background: linear-gradient(45deg, #FFD700, #b8860b); color: #000; height: 50px;">FALIMA BAK</button>
            </section>

            <section class="ride-card">
                <div class="card-header">
                    <h3><i class="fa-solid fa-car-side"></i> Lale VIP Drive</h3>
                    <span style="font-size: 10px; color: #00ff00; font-weight: 800;">CANLI</span>
                </div>
                <p style="font-size: 11px; opacity: 0.7;">İstanbul içinde lüks ve hızlı ulaşım.</p>
                <div class="ride-options">
                    <div class="ride-btn" onclick="requestRide('Uber')">
                        <i class="fa-brands fa-uber"></i>
                        <p>UBER ÇAĞIR</p>
                    </div>
                    <div class="ride-btn" onclick="requestRide('BiTaksi')">
                        <i class="fa-solid fa-taxi"></i>
                        <p>BITAKSI</p>
                    </div>
                </div>
            </section>

            <section class="glass-card">
                <div class="card-header"><h3><i class="fa-solid fa-store"></i> Bazar Fırsatları</h3></div>
                <div class="bazar-flex">
                    <div class="bazar-card">
                        <i class="fa-solid fa-gem" style="color: var(--gold); font-size: 24px;"></i>
                        <p style="font-size: 12px; font-weight: 700; margin: 8px 0;">Kapalıçarşı</p>
                        <button class="btn-gold" onclick="navTo('Grand Bazaar Istanbul')">GİT</button>
                    </div>
                    <div class="bazar-card">
                        <i class="fa-solid fa-pepper-hot" style="color: #ff4d4d; font-size: 24px;"></i>
                        <p style="font-size: 12px; font-weight: 700; margin: 8px 0;">Mısır Çarşısı</p>
                        <button class="btn-gold" onclick="navTo('Spice Bazaar Istanbul')">GİT</button>
                    </div>
                </div>
            </section>

            <button class="btn-gold" onclick="triggerExit()" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); margin-top: 20px; height: 50px;">
                <i class="fa-solid fa-power-off"></i> UYGULAMADAN ÇIK
            </button>
        </main>

        <nav>
            <button class="nav-item active"><i class="fa-solid fa-house"></i><span>ANA SAYFA</span></button>
            <button class="nav-item" onclick="navTo('Hotels Istanbul')"><i class="fa-solid fa-bed"></i><span>OTEL</span></button>
            <button class="nav-item" onclick="navTo('Turkish Airlines')"><i class="fa-solid fa-plane"></i><span>UÇAK</span></button>
            <button class="nav-item" onclick="window.location.href='https://wa.me/5492246496971?text=Merhaba!'"><i class="fa-solid fa-comment-dots"></i><span>DESTEK</span></button>
        </nav>
    </div>

    <div id="cameraModal">
        <video id="videoFeed" autoplay playsinline></video>
        <div class="camera-ui"><i class="fa-solid fa-xmark" style="color:#fff; font-size:30px;" onclick="closeCamera()"></i><button class="capture-btn" onclick="takePhoto()"></button></div>
    </div>

    <div id="fortuneOverlay">
        <div class="scanning-line"></div>
        <div class="fortune-card">
            <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--gold); font-size: 40px; margin-bottom: 20px;"></i>
            <h2 style="color: var(--gold); margin-bottom: 15px;">FALINIZ ÇIKTI!</h2>
            <p id="fortuneText" style="line-height: 1.6; font-weight: 600;"></p>
            <button class="btn-gold" style="margin-top: 25px;" onclick="closeFortune()">TEŞEKKÜRLER</button>
        </div>
    </div>

    <div id="exitOverlay"><div class="exit-text">LALE TURKEY<br><span style="font-size: 14px; opacity: 0.6;">GÜLE GÜLE...</span></div></div>

    <script>
        const init = () => {
            setTimeout(() => {
                document.getElementById('splash').style.transform = 'translateY(-100%)';
                document.getElementById('appShell').classList.add('active');
                startTicker();
            }, 3500);
        };

        const startTicker = () => {
            const ticker = document.getElementById('tickerText');
            const news = ["İstanbul Boğazı: Vapurlar aktif.", "Kapalıçarşı: Bugün indirim günü.", "Hava Durumu: 18°C Güneşli.", "Lale VIP Drive: Araçlar kapınızda."];
            let i = 0;
            setInterval(() => { ticker.innerText = news[i]; i = (i + 1) % news.length; }, 6000);
        };

        // LÓGICA DE TRANSPORTE REAL
        const requestRide = (service) => {
            const ticker = document.getElementById('tickerText');
            ticker.innerText = `${service} yönlendiriliyor...`;
            
            setTimeout(() => {
                if(service === 'Uber') {
                    window.location.href = "uber://?action=setPickup&pickup=my_location";
                } else {
                    window.location.href = "bitaksi://";
                }
                // Fallback a web si no hay app
                setTimeout(() => {
                    if (!document.hidden) {
                        window.open(service === 'Uber' ? "https://www.uber.com/tr" : "https://www.bitaksi.com", "_blank");
                    }
                }, 2500);
            }, 1000);
        };

        let stream = null;
        const openCamera = async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('videoFeed').srcObject = stream;
                document.getElementById('cameraModal').style.display = 'flex';
            } catch (err) { alert("Kamera kapalı."); }
        };

        const closeCamera = () => { if(stream) stream.getTracks().forEach(t => t.stop()); document.getElementById('cameraModal').style.display = 'none'; };

        const takePhoto = () => {
            document.body.style.filter = "brightness(2)";
            setTimeout(() => { document.body.style.filter = "none"; closeCamera(); showFortune(); }, 100);
        };

        const showFortune = () => {
            const fortunes = ["Kısmetin kapıda! Çok yakında bir yolculuk görünüyor.", "Yüreğin ferahlıyor. Beklediğin haber yolda.", "Fincanında bir anahtar var. Yeni bir kapı açılıyor.", "Dost görünümlü birine dikkat et, şansın seni koruyor.", "Büyük bir kalabalığa gireceksin, yıldızın parlayacak.", "Parasal bir ferahlama var, destek alacaksın.", "Göz aydınlığı var! Sevdiğinden hediye alacaksın.", "Hanene ay doğuyor. Huzur geliyor.", "Yolun açık, engeller kalkıyor. Hedefine yakınsın.", "Fincanın dibinde balık var. Bereket demektir.", "İki vakte kadar bir görüşmen var, hayatın değişebilir.", "Bir dileğin var, sabret. Zamanı yaklaşıyor.", "Nazara gelmişsin ama dua seni koruyor.", "Kalbindeki o niyet gerçek oluyor.", "Eski bir dostun kapını çalacak."];
            document.getElementById('fortuneText').innerText = fortunes[Math.floor(Math.random() * fortunes.length)];
            document.getElementById('fortuneOverlay').style.display = 'flex';
        };

        const closeFortune = () => document.getElementById('fortuneOverlay').style.display = 'none';
        const navTo = (q) => window.open(`https://www.google.com/maps/search/${encodeURIComponent(q)}`, '_blank');

        const triggerExit = () => {
            const e = document.getElementById('exitOverlay');
            e.style.display = 'flex';
            setTimeout(() => { e.style.opacity = '1'; setTimeout(() => { window.location.href = "about:blank"; }, 2500); }, 100);
        };

        window.addEventListener('load', init);
    </script>
</body>
</html>
