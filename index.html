<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lale Turkey - Süper Uygulama</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #E30A17;
            --deep-blue: #002D44;
            --gold: #FFD700;
            --bg: #F8FAFC;
            --glass: rgba(255, 255, 255, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: #000; display: flex; justify-content: center; height: 100vh; overflow: hidden; }

        .app-shell {
            width: 100%; max-width: 414px; height: 100%;
            background: var(--bg); position: relative; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* --- SPLASH SCREEN CON TULIPÁN 3D --- */
        #splash {
            position: absolute; inset: 0; background: var(--deep-blue);
            z-index: 9000; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: transform 1s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .tulip-3d {
            width: 120px; height: 150px; position: relative;
            transform-style: preserve-3d; animation: rotateTulip 5s infinite linear;
        }

        .petal {
            position: absolute; width: 60px; height: 100px;
            background: linear-gradient(to bottom, #ff4d4d, var(--primary-red));
            border-radius: 50% 50% 10% 10%;
            transform-origin: bottom center;
            opacity: 0.9; box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        .p1 { transform: rotateY(0deg) rotateX(20deg); }
        .p2 { transform: rotateY(120deg) rotateX(20deg); }
        .p3 { transform: rotateY(240deg) rotateX(20deg); }

        @keyframes rotateTulip {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        /* --- UI COMPONENTS --- */
        header { padding: 60px 24px 20px; background: white; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-text { font-size: 28px; font-weight: 800; color: var(--primary-red); letter-spacing: -1px; }

        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px; }

        /* FUNCIÓN ESPECIAL: KARGA NOKTASI (Carga de Tarjetas) */
        .special-function-card {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            padding: 25px; border-radius: 30px; color: white; margin-bottom: 25px;
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.3);
        }
        .special-function-card h3 { font-size: 20px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .btn-special { 
            background: var(--gold); border: none; padding: 12px 20px; 
            border-radius: 15px; font-weight: 800; color: var(--deep-blue);
            margin-top: 15px; width: 100%; cursor: pointer; transition: 0.3s;
        }
        .btn-special:active { transform: scale(0.95); }

        /* ACCESOS DIRECTOS GRID */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { 
            background: white; padding: 20px; border-radius: 25px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column; gap: 12px; cursor: pointer;
        }
        .card i { font-size: 24px; color: var(--primary-red); }
        .card span { font-weight: 700; font-size: 14px; color: var(--deep-blue); }

        /* FOOTER NAV */
        nav {
            position: absolute; bottom: 25px; left: 20px; right: 20px;
            height: 75px; background: var(--glass); backdrop-filter: blur(20px);
            border-radius: 25px; display: flex; justify-content: space-around;
            align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--gray); cursor: pointer; border: none; background: none; }
        .nav-item.active { color: var(--primary-red); }
        .nav-item span { font-size: 10px; font-weight: 700; margin-top: 4px; }
    </style>
</head>
<body>

<div class="app-shell">
    <div id="splash">
        <div class="tulip-3d">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
        </div>
        <h1 style="color: white; margin-top: 30px; letter-spacing: 5px;">LALE TURKEY</h1>
    </div>

    <header>
        <div class="logo-text">LALE</div>
    </header>

    <div class="content">
        <div class="special-function-card">
            <h3><i class="fa-solid fa-bolt-lightning"></i> Kart Yükleme Noktası</h3>
            <p style="font-size: 13px; opacity: 0.9;">En yakın İstanbulkart veya ulaşım kartı dolum noktasını saniyeler içinde bulun.</p>
            <button class="btn-special" onclick="locateService('İstanbulkart Yükleme Noktası')">HEMEN BUL</button>
        </div>

        <div class="grid">
            <div class="card" onclick="window.location.href='https://www.sehirhatlari.istanbul/tr/sefer-hatlari'">
                <i class="fa-solid fa-ship"></i>
                <span>Vapur Seferleri</span>
            </div>
            <div class="card" onclick="locateService('Grand Bazaar, Istanbul')">
                <i class="fa-solid fa-shop"></i>
                <span>Bazar Rehberi</span>
            </div>
            <div class="card" onclick="alert('Acil Durum Bildirimleri Aktif')">
                <i class="fa-solid fa-triangle-exclamation" style="color: orange;"></i>
                <span>Hızlı Uyarı</span>
            </div>
            <div class="card" onclick="window.location.href='https://www.metro.istanbul'">
                <i class="fa-solid fa-train-subway"></i>
                <span>Metro Haritası</span>
            </div>
        </div>
    </div>

    <nav>
        <button class="nav-item active"><i class="fa-solid fa-house"></i><span>Ana Sayfa</span></button>
        <button class="nav-item" onclick="alert('Keşfet Modülü Yakında')"><i class="fa-solid fa-compass"></i><span>Keşfet</span></button>
        <button class="nav-item" onclick="alert('Profil Ayarları')"><i class="fa-solid fa-user"></i><span>Profil</span></button>
    </nav>
</div>

<script>
    // 1. Lógica del Splash Screen
    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('splash').style.transform = 'translateY(-100%)';
        }, 3000);
    });

    // 2. Función Especial: Localización Inteligente
    function locateService(query) {
        // Esta función utiliza la API de geolocalización del navegador y Maps
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                // Abre Google Maps buscando el servicio más cercano a la ubicación real
                window.location.href = `https://www.google.com/maps/search/${encodeURIComponent(query)}/@${lat},${lon},15z`;
            }, () => {
                // Fallback si no hay GPS
                window.location.href = `https://www.google.com/maps/search/${encodeURIComponent(query)}`;
            });
        } else {
            window.location.href = `https://www.google.com/maps/search/${encodeURIComponent(query)}`;
        }
    }

    // 3. Notificación Push de simulación
    setTimeout(() => {
        console.log("Lale Turkey: Uygulama hazır.");
    }, 4000);
</script>

</body>
</html>
