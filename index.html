<!DOCTYPE html>
<html lang="tr">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KXB18T4285"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KXB18T4285');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Focus AI | Soberanía Digital</title>
    <style>
        :root { 
            --cyan: #00FFFF; --purple: #bc13fe; --wa-green: #25D366; 
            --gold: #FFD700; --tea-red: #d32f2f; --bg-dark: #050505;
        }
        
        body { 
            background: var(--bg-dark); color: #fff; font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; overflow-x: hidden; 
        }

        /* Splash Screen con Saludo Dinámico */
        #splash-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 10000; transition: 0.8s; 
        }
        .splash-circle { 
            width: 160px; height: 160px; border: 2px solid var(--cyan); border-radius: 50%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            animation: pulse 2s infinite; 
        }
        #greeting-text { font-size: 0.8rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }

        @keyframes pulse { 0%, 100% { box-shadow: 0 0 15px var(--cyan); } 50% { box-shadow: 0 0 40px var(--cyan); } }

        /* Efecto Escáner Láser */
        #scanner-line {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--cyan); box-shadow: 0 0 20px var(--cyan); z-index: 9999;
            animation: scanMove 2s linear infinite;
        }
        @keyframes scanMove { 0% { top: 0; } 100% { top: 100%; } }

        /* Navegación */
        .tab-bar { display: flex; width: 100%; background: #111; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--cyan); }
        .tab-item { flex: 1; padding: 15px; font-size: 0.7rem; font-weight: 900; color: #555; cursor: pointer; text-align: center; }
        .tab-item.active { color: var(--cyan); border-bottom: 3px solid var(--cyan); }

        .tab-content { display: none; width: 92%; max-width: 400px; padding: 20px 0 100px 0; animation: fadeIn 0.5s; }
        .tab-content.active { display: block; }

        /* Estética de Tarjetas */
        .glass-card { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(0,255,255,0.1); 
            border-radius: 20px; padding: 18px; margin-bottom: 15px; width: 100%; box-sizing: border-box; 
            backdrop-filter: blur(10px);
        }

        .btn-premium { 
            width: 100%; padding: 16px; border-radius: 12px; border: none; color: #fff; 
            font-weight: bold; margin: 10px 0; cursor: pointer; font-size: 0.85rem; 
            text-decoration: none; display: flex; align-items: center; justify-content: center; 
        }
        
        .bg-gold { background: linear-gradient(90deg, #ffcc00, #ff9900); color: #000; box-shadow: 0 5px 15px rgba(255,204,0,0.3); }
        .bg-gastro { background: linear-gradient(90deg, #008080, var(--cyan)); color: #000; }
        .bg-tea { background: var(--tea-red); border: 1px solid #ff4444; }
        .bg-wa { background: var(--wa-green); }

        .history-box { 
            max-height: 120px; overflow-y: auto; margin-top: 15px; border-top: 1px solid rgba(0,255,255,0.2); 
            padding-top: 10px; font-size: 0.65rem; color: #aaa;
        }
        .history-item { margin-bottom: 8px; border-left: 2px solid var(--gold); padding-left: 8px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="scanner-line"></div>

    <div id="splash-screen">
        <div id="greeting-text">YÜKLENİYOR...</div>
        <div class="splash-circle">
            <span style="font-size: 0.6rem; letter-spacing: 3px;">NEURAL</span>
            <span style="color: var(--cyan); font-weight: 900; font-size: 1.2rem;">FOCUS AI</span>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="openTab('biz')">🏢 BUSINESS</div>
        <div class="tab-item" onclick="openTab('life')">🔥 LIFESTYLE</div>
    </div>

    <div id="biz" class="tab-content active">
        <div class="glass-card" style="border-color: var(--gold);">
            <h3 style="color: var(--gold); margin: 0 0 10px 0; font-size: 1rem;">🛡️ MİLLİ EGEMENLİK ANALİZİ</h3>
            <div id="report-display" style="font-size: 0.8rem; min-height: 60px; line-height: 1.4;">
                Piyasa Durumu: <span style="color:var(--wa-green)">AKTİF</span><br>
                USD/TRY Verisi: ₺<span id="live-rate">43.64</span>
            </div>
            <button onclick="startSovereignScan()" class="btn-premium bg-gold">DİJİTAL KALKANI ÇALIŞTIR</button>
            <div id="biz-history" class="history-box"></div>
        </div>

        <div class="glass-card" style="padding:0; overflow:hidden; border-color: var(--cyan);">
            <iframe width="100%" height="220" src="https://www.youtube.com/embed/X-FWm-NHEBc?autoplay=1&mute=1" frameborder="0" allowfullscreen></iframe>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <a href="https://chat.whatsapp.com/FPplgqnE2NiHmahVJXCic2" class="btn-premium" style="background:#111; border:1px solid #333;">🏥 SAĞLIK</a>
            <a href="https://chat.whatsapp.com/KQBkGZhDnJt2vxk7x5VdRI" class="btn-premium" style="background:#111; border:1px solid #333;">🍲 GASTRO</a>
        </div>
    </div>

    <div id="life" class="tab-content">
        <div class="glass-card">
            <h3 style="color: var(--cyan); margin: 0 0 10px 0; font-size: 1rem;">📸 GASTRO & SAĞLIK VİZYONU</h3>
            <p style="font-size: 0.7rem; color: #888;">Yemeği yazın ve fotoğraflayın, AI analiz etsin.</p>
            <input type="text" id="foodSearch" placeholder="Yemek ismi (Örn: Kebap)" style="width:100%; padding:12px; margin-bottom:12px; border-radius:8px; border:1px solid var(--cyan); background:#000; color:#fff; outline:none;">
            <button onclick="startGastroScan()" class="btn-premium bg-gastro">KAMERAYI AÇ VE TARA</button>
            <input type="file" id="gastroFile" accept="image/*" capture="environment" style="display:none" onchange="executeGastroAction()">
        </div>

        <div class="glass-card" style="border-color: var(--purple);">
            <h3 style="color: var(--purple); margin: 0 0 10px 0; font-size: 1rem;">🔮 YAPAY ZEKA KAHVE FALI</h3>
            <button onclick="startFalScan()" class="btn-premium" style="background: var(--purple);">FİNCAN FOTOĞRAFI ÇEK</button>
            <input type="file" id="falFile" accept="image/*" capture="environment" style="display:none" onchange="executeFalAction()">
            <div id="fal-result-box" style="display:none; margin-top:15px; font-style: italic; color: var(--gold); font-size: 0.85rem; border-top: 1px solid #333; padding-top:10px;"></div>
        </div>

        <a href="https://wa.me/5492246496971?text=Merhaba%20Lucas,%20harika%20bir%20iş%20çıkarmışsın!%20Sana%20bir%20çay%20ısmarlamak%20istiyorum." class="btn-premium bg-tea">☕ BİR ÇAY ISMARLA (İLETİŞİM)</a>
        
        <button onclick="shareApp()" class="btn-premium bg-wa">📲 UYGULAMAYI PAYLAŞ</button>
    </div>

    <script>
        // --- 1. SALUDO INICIAL Y SPLASH ---
        window.onload = () => {
            const hour = new Date().getHours();
            let greeting = "";
            if(hour >= 5 && hour < 12) greeting = "GÜNAYDIN";
            else if(hour >= 12 && hour < 18) greeting = "İYİ GÜNLER";
            else greeting = "İYİ AKŞAMLAR";
            
            document.getElementById('greeting-text').innerText = greeting;
            
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 800);
            }, 2500);
            updateRate();
        };

        function openTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function speak(text) {
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'tr-TR';
            window.speechSynthesis.speak(utter);
        }

        async function updateRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();
                document.getElementById('live-rate').innerText = data.rates.TRY.toFixed(2);
            } catch(e) {}
        }

        // --- 2. ESCÁNER DE SOBERANÍA (NUEVA FUNCIÓN) ---
        function startSovereignScan() {
            const scanner = document.getElementById('scanner-line');
            const report = document.getElementById('report-display');
            scanner.style.display = 'block';
            speak("Veri kalkanı devreye girdi. Küresel izleyiciler engelleniyor.");
            
            report.innerHTML = "<span style='color:var(--cyan); font-family:monospace;'>[SİSTEM GÜVENLİ]<br>> Google İzleyicileri Engellendi...<br>> Yerel Sunucu Bağlantısı Aktif...</span>";

            setTimeout(() => {
                scanner.style.display = 'none';
                const tips = [
                    "SANAYİ: Hammadde ithalatı için kur dengesi uygun, yerli üretime odaklanın.",
                    "İNŞAAT: Demir-çelik endeksi AI tarafından optimize edildi, alım zamanı.",
                    "SAĞLIK: Tıbbi verileriniz yerli şifreleme ile koruma altına alındı.",
                    "GASTRONOMİ: Yerel tedarik zinciri ile %12 maliyet tasarrufu sağlandı."
                ];
                const msg = tips[Math.floor(Math.random()*tips.length)];
                report.innerHTML = `<b style='color:var(--gold)'>🛡️ STRATEJİK KARAR:</b><br>${msg}`;
                
                const h = document.getElementById('biz-history');
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = `[${new Date().toLocaleTimeString('tr-TR')}] ${msg}`;
                h.prepend(item);
                speak(msg);
            }, 3000);
        }

        // --- 3. GASTRO & SAĞLIK ---
        function startGastroScan() {
            if(!document.getElementById('foodSearch').value) {
                alert("Lütfen önce yemeğin adını yazın!");
                return;
            }
            document.getElementById('gastroFile').click();
        }

        function executeGastroAction() {
            const scanner = document.getElementById('scanner-line');
            scanner.style.display = 'block';
            speak("Gastro vizyon analizi yapılıyor.");
            
            setTimeout(() => {
                scanner.style.display = 'none';
                const food = document.getElementById('foodSearch').value;
                window.open(`https://www.google.com/search?q=${encodeURIComponent(food)}+kalori+sağlık+değeri+analizi`, '_blank');
            }, 2000);
        }

        // --- 4. KAHVE FALI ---
        function startFalScan() {
            document.getElementById('falFile').click();
        }

        function executeFalAction() {
            const scanner = document.getElementById('scanner-line');
            const resBox = document.getElementById('fal-result-box');
            scanner.style.display = 'block';
            resBox.style.display = 'block';
            resBox.innerText = "Fincanınızdaki semboller çözümleniyor...";
            speak("Gelecek taranıyor.");

            setTimeout(() => {
                scanner.style.display = 'none';
                const luck = [
                    "Kısmetin açılıyor, beklediğin o telefon bugün gelecek.",
                    "Hanene huzur ve bereket doğuyor, bir yolculuk görünüyor.",
                    "Sıkıntıların bitiyor, yapay zeka senin için parlak bir gelecek görüyor."
                ];
                const msg = luck[Math.floor(Math.random()*luck.length)];
                resBox.innerHTML = `🔮 <b>AI FALINIZ:</b> <br>${msg}`;
                speak(msg);
            }, 3500);
        }

        function shareApp() {
            window.open('https://wa.me/?text=Neural%20Focus%20AI%20ile%20dijital%20egemenliğimi%20koruyorum!%20Sen%20de%20dene!');
        }
    </script>
</body>
            </html>
