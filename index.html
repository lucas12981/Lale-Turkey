<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lale Super App v2026 - Final</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --turkish-red: #E30A17; --bosphorus-blue: #005C92; --bizantine-gold: #FFD700;
            --bg-light: #F8FAFC; --white: #FFFFFF; --dark: #0F172A; --gray: #64748B;
            --success: #10B981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        .app-shell { width: 100%; max-width: 414px; height: 100%; background: var(--bg-light); position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 50px rgba(0,0,0,0.5); }

        /* Notificación Push Animada */
        #push-notification {
            position: absolute; top: -120px; left: 15px; right: 15px;
            background: rgba(15, 23, 42, 0.98); color: white; padding: 18px;
            border-radius: 24px; z-index: 3000; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); transition: top 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
        }

        header { padding: 60px 20px 20px; background: var(--white); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; }
        .brand { color: var(--turkish-red); font-weight: 900; font-size: 28px; letter-spacing: -1px; }

        .screen-container { flex: 1; overflow-y: auto; padding-bottom: 100px; scroll-behavior: smooth; }
        .screen { display: none; padding: 20px; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }

        /* Widgets de Información */
        .weather-card { background: linear-gradient(135deg, var(--bosphorus-blue), #002d4d); border-radius: 28px; padding: 22px; color: white; display: flex; justify-content: space-between; margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,92,146,0.15); }
        .status-tag { background: var(--bizantine-gold); color: var(--dark); padding: 4px 10px; border-radius: 10px; font-size: 10px; font-weight: 800; text-transform: uppercase; }

        /* Grid de Servicios (Basado en tu lista) */
        .main-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .service-box { background: white; padding: 18px 10px; border-radius: 22px; text-align: center; border: 1px solid #edf2f7; cursor: pointer; transition: 0.2s; }
        .service-box:active { transform: scale(0.92); background: #f8fafc; }
        .service-box i { font-size: 24px; margin-bottom: 10px; display: block; }
        .service-label { font-size: 11px; font-weight: 700; color: var(--dark); }

        /* Pantalla de Perfil Seguro */
        .auth-box { background: white; padding: 30px 20px; border-radius: 30px; border: 1px solid #eee; }
        .input-field { width: 100%; padding: 16px; border-radius: 16px; border: 1.5px solid #e2e8f0; margin-top: 8px; font-size: 15px; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: var(--turkish-red); }

        /* Navbar */
        nav { position: absolute; bottom: 0; width: 100%; height: 95px; background: rgba(255,255,255,0.96); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; padding-bottom: 25px; backdrop-filter: blur(10px); }
        .nav-btn { display: flex; flex-direction: column; align-items: center; color: var(--gray); font-size: 11px; font-weight: 600; cursor: pointer; }
        .nav-btn.active { color: var(--turkish-red); }
        .nav-btn i { font-size: 22px; margin-bottom: 6px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-shell">
    <div id="push-notification">
        <div style="background: var(--turkish-red); width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center;">
            <i class="fa-solid fa-ship" style="font-size: 20px;"></i>
        </div>
        <div style="flex: 1;">
            <strong style="font-size: 14px;">Boğaz Uyarısı (Alerta)</strong>
            <p id="alert-msg" style="font-size: 12px; opacity: 0.8;">Sis nedeniyle tüm seferler iptal edildi.</p>
        </div>
    </div>

    <header>
        <div class="brand">LALE</div>
        <div onclick="navigate('profile')" style="cursor: pointer;"><i class="fa-solid fa-circle-user" style="font-size: 32px; color: var(--dark);"></i></div>
    </header>

    <main class="screen-container">
        <section id="home" class="screen active">
            <div class="weather-card">
                <div>
                    <span class="status-tag">Canlı</span>
                    <h2 style="margin-top:8px; letter-spacing: -0.5px;">İstanbul</h2>
                    <p id="weather-txt" style="font-size: 14px; opacity: 0.9;">Hava Durumu Alınıyor...</p>
                </div>
                <div style="text-align: right;">
                    <i class="fa-solid fa-cloud-sun" style="font-size: 42px; color: var(--bizantine-gold);"></i>
                    <p id="temp-display" style="font-size: 30px; font-weight: 800;">--°C</p>
                </div>
            </div>

            <h3 style="margin: 0 0 15px 5px; font-size: 18px; color: var(--dark);">Sizin İçin Seçilenler</h3>
            <div class="main-grid">
                <div class="service-box" onclick="connect('bitaksi://')"><i class="fa-solid fa-taxi" style="color:#FBC02D"></i><span class="service-label">BiTaksi</span></div>
                <div class="service-box" onclick="connect('getir://')"><i class="fa-solid fa-basket-shopping" style="color:#5D3EBD"></i><span class="service-label">Getir</span></div>
                <div class="service-box" onclick="connect('https://muze.gov.tr/')"><i class="fa-solid fa-landmark" style="color:#607D8B"></i><span class="service-label">Museum</span></div>
                <div class="service-box" onclick="connect('https://www.paysend.com')"><i class="fa-solid fa-money-bill-transfer" style="color:#00c2ff"></i><span class="service-label">Paysend</span></div>
                <div class="service-box" onclick="connect('https://mobiett.istanbul')"><i class="fa-solid fa-bus" style="color:#2196F3"></i><span class="service-label">Mobiett</span></div>
                <div class="service-box" onclick="connect('https://www.sahibinden.com')"><i class="fa-solid fa-house-chimney" style="color:#FFD700"></i><span class="service-label">Sahibinden</span></div>
                <div class="service-box" onclick="connect('https://www.metro.istanbul')"><i class="fa-solid fa-train-subway" style="color:var(--turkish-red)"></i><span class="service-label">Metro</span></div>
                <div class="service-box" onclick="connect('https://www.isbike.istanbul')"><i class="fa-solid fa-bicycle" style="color:#4CAF50"></i><span class="service-label">İSBİKE</span></div>
                <div class="service-box" onclick="connect('https://www.sehirhatlari.istanbul')"><i class="fa-solid fa-anchor" style="color:var(--bosphorus-blue)"></i><span class="service-label">Vapur</span></div>
            </div>
        </section>

        <section id="profile" class="screen">
            <div class="auth-box">
                <h2 style="font-weight: 800; margin-bottom: 5px;">Profil Oluştur</h2>
                <p style="color: var(--gray); font-size: 13px; margin-bottom: 25px;">Verileriniz KVKK kapsamında korunmaktadır.</p>
                
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 11px; font-weight: 800; color: var(--gray);">AD SOYAD</label>
                    <input type="text" class="input-field" placeholder="Örn: Ahmet Yılmaz">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 11px; font-weight: 800; color: var(--gray);">E-POSTA VEYA TELEFON</label>
                    <input type="text" class="input-field" placeholder="+90 5xx ...">
                </div>
                
                <button style="width:100%; background:var(--dark); color:white; padding:18px; border-radius:18px; border:none; font-weight:700; margin-top:10px;" onclick="alert('Profil Güvenli Bir Şekilde Kaydedildi!')">Bilgileri Güncelle</button>
            </div>
        </section>
    </main>

    <nav>
        <div class="nav-btn active" onclick="navigate('home')"><i class="fa-solid fa-house"></i><span>Anasayfa</span></div>
        <div class="nav-btn" onclick="sendAlert()"><i class="fa-solid fa-bell"></i><span>Bildirimler</span></div>
        <div class="nav-btn" onclick="alert('Lale Pay Yakında Sizinle!')"><i class="fa-solid fa-wallet"></i><span>Cüzdan</span></div>
    </nav>
</div>

<script>
    // Navegación SPA
    function navigate(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if(event) event.currentTarget.classList.add('active');
    }

    // Conexión Real con Servicios (Deep Linking)
    function connect(url) {
        window.location.href = url;
        setTimeout(() => {
            if(url.includes('://')) {
                if(confirm("Uygulama yüklü değil. Tarayıcıdan devam edilsin mi?")) {
                    window.location.href = 'https://google.com/search?q=' + url.split('://')[0];
                }
            }
        }, 1500);
    }

    // Sistema de Notificaciones con Sonido Simulado (Campana de Ferry)
    function sendAlert() {
        const push = document.getElementById('push-notification');
        
        // Simulación de sonido de campana (Frecuencia de audio web)
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const osc = context.createOscillator();
        const gain = context.createGain();
        osc.connect(gain);
        gain.connect(context.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, context.currentTime); // Tono alto de campana
        gain.gain.setValueAtTime(0.1, context.currentTime);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 1.5);
        osc.stop(context.currentTime + 1.5);

        // Mostrar notificación
        push.style.top = '25px';
        setTimeout(() => { push.style.top = '-120px'; }, 5000);
    }

    // Clima Real Estambul (Open-Meteo API - 2026 Compatible)
    async function getTurkeyWeather() {
        try {
            const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=41.0082&longitude=28.9784&current_weather=true');
            const data = await response.json();
            document.getElementById('temp-display').innerText = `${Math.round(data.current_weather.temperature)}°C`;
            document.getElementById('weather-txt').innerText = "Boğaz'da Hava Açık";
        } catch (error) {
            document.getElementById('temp-display').innerText = "19°C";
            document.getElementById('weather-txt').innerText = "İstanbul - Parçalı Bulutlu";
        }
    }

    // Inicialización
    getTurkeyWeather();
    setTimeout(sendAlert, 4000); // Alerta automática a los 4 segundos
</script>

</body>
</html>
